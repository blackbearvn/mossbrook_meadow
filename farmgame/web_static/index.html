<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mossbrook Meadow — chơi trên web</title>
<link rel="stylesheet" href="/static/xterm.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #10141c; color: #e8ecf4;
               font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
  #bar { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
         background: #171d29; border-bottom: 1px solid #232b3b; }
  #bar h1 { font-size: 15px; margin: 0; letter-spacing: .5px; }
  #bar .seed { opacity: .7; font-size: 13px; }
  #bar .spacer { flex: 1; }
  .btn { background: #233052; color: #e8ecf4; border: 1px solid #35497a;
         border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .btn:hover { background: #2c3c68; }
  #stage { position: absolute; inset: 49px 0 0 0; }
  #term { width: 100%; height: 100%; }
  #term .xterm { height: 100%; }
  #overlay { position: absolute; inset: 0; display: none;
             align-items: center; justify-content: center; flex-direction: column;
             gap: 14px; background: rgba(9, 12, 18, .82); text-align: center; }
  #overlay.show { display: flex; }
  #overlay p { margin: 0; font-size: 16px; }
  #hint { padding: 4px 14px 10px; font-size: 12px; color: #9aa7bd;
          position: absolute; bottom: 0; left: 0; right: 0;
          display: flex; gap: 18px; flex-wrap: wrap; pointer-events: none; }
  .tag { background: #1a2233; border: 1px solid #27324a; border-radius: 6px;
         padding: 2px 8px; }
</style>
</head>
<body>
  <div id="bar">
    <h1>◆ Mossbrook Meadow</h1>
    <span class="seed">chơi trên web</span>
    <span class="spacer"></span>
    <button id="reload" class="btn" title="Tắt rồi mở lại trò chơi, giữ nguyên ván đang lưu">Chơi lại</button>
  </div>
  <div id="stage">
    <div id="term"></div>
    <div id="overlay">
      <p id="overlay-text">Trò chơi đã thoát.</p>
      <button id="restart" class="btn">Vào lại</button>
    </div>
  </div>
  <div id="hint">
    <span class="tag">WASD đi</span><span class="tag">E tương tác</span>
    <span class="tag">M bản đồ</span><span class="tag">N nhiệm vụ</span>
    <span class="tag">C nhân vật</span><span class="tag">Q lưu &amp; về menu</span>
    <span class="tag">nhấn V bật/tắt hoạt cảnh</span>
  </div>
<script src="/static/xterm.js"></script>
<script src="/static/xterm-addon-fit.js"></script>
<script>
(() => {
  const term = new Terminal({
    cursorBlink: true, fontSize: 15, fontFamily: '"DejaVu Sans Mono", "Noto Sans Mono", monospace',
    theme: { background: '#10141c', foreground: '#e8ecf4' },
    scrollback: 4000, convertEol: false,
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));
  fit.fit();

  let cursor = 0;
  let exited = false;
  let pollAborted = false;

  const encoder = new TextDecoder('utf-8');
  const decodeChunk = (bytes) => encoder.decode(bytes, { stream: true });

  const post = (url, body) => fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });

  const size = () => ({ cols: term.cols, rows: term.rows });

  // Gửi phím: gom các ký tự trong 25ms thành một gói cho nhẹ request.
  let pending = '';
  let pendingTimer = null;
  term.onData((data) => {
    pending += data;
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(() => {
      const chunk = pending;
      pending = '';
      if (chunk && !exited) post('/api/keys', { data: chunk }).catch(() => {});
    }, 25);
  });

  const showOverlay = (text) => {
    document.getElementById('overlay-text').textContent = text;
    document.getElementById('overlay').classList.add('show');
  };
  const hideOverlay = () => document.getElementById('overlay').classList.remove('show');

  const poll = async () => {
    if (pollAborted) return;
    try {
      const res = await fetch(`/api/out?n=${cursor}&wait=900`, { cache: 'no-store' });
      if (!res.ok) throw new Error('bad status');
      const data = await res.json();
      if (data.b64) {
        const bin = atob(data.b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
        term.write(decodeChunk(bytes));
      }
      cursor = data.next;
      if (data.exited && !exited) {
        exited = true;
        showOverlay('Trò chơi đã thoát. Ấn “Vào lại” để chơi tiếp (ván đã được lưu).');
        return;
      }
    } catch (error) {
      await new Promise((done) => setTimeout(done, 500));
    }
    setTimeout(poll, 10);
  };

  const restart = async () => {
    hideOverlay();
    exited = false;
    term.reset();
    term.clear();
    cursor = 0;
    const dims = size();
    try {
      await post(`/api/restart?cols=${dims.cols}&rows=${dims.rows}`, {});
    } catch (error) { /* thử lại ở vòng poll */ }
    setTimeout(poll, 300);
  };

  document.getElementById('reload').addEventListener('click', restart);
  document.getElementById('restart').addEventListener('click', restart);

  window.addEventListener('resize', () => {
    fit.fit();
    if (!exited) post('/api/size', size()).catch(() => {});
  });

  post('/api/size', size()).catch(() => {});
  poll();
})();
</script>
</body>
</html>
